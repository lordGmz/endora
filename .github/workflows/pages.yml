# Site de présentation (GitHub Pages) : https://lix033.github.io/endora/
# Publie aussi les scripts d'installation à une adresse courte.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/install.sh', 'scripts/install.ps1', 'build/logo.svg', 'docs/assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Assembler le site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp build/logo.svg _site/favicon.svg
          cp docs/assets/social-preview.png _site/
          cp scripts/install.sh scripts/install.ps1 _site/
          node -e "require('sharp')('build/logo.svg').resize(180,180).png().toFile('_site/icon-180.png')"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
